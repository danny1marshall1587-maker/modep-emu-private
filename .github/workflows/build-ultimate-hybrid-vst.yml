name: Build Tubular Amp and Euphoria Amp Multi-Platform Suite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vst-au-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-universal
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev

      # 1. Build Tubular Amp (Cyber Ultimate Hybrid)
      - name: Configure Tubular Amp CMake (macOS Universal Binary)
        if: runner.os == 'macOS'
        run: |
          cmake -S plugins/cyber-ultimate-hybrid-vst -B build-tubular -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure Tubular Amp CMake (Windows and Linux)
        if: runner.os != 'macOS'
        run: |
          cmake -S plugins/cyber-ultimate-hybrid-vst -B build-tubular -DCMAKE_BUILD_TYPE=Release

      - name: Build Tubular Amp Plugins
        run: |
          cmake --build build-tubular --config Release --parallel

      - name: Package Tubular Amp Desktop Binaries
        shell: bash
        run: |
          mkdir -p release_tubular
          cp -r build-tubular/CyberUltimateHybrid_artefacts/Release/* release_tubular/
          cd release_tubular && 7z a -tzip ../tubular-amp-${{ matrix.platform }}.zip .

      # 2. Build Euphoria Amp (Pure Fluid Dynamics)
      - name: Configure Euphoria Amp CMake (macOS Universal Binary)
        if: runner.os == 'macOS'
        run: |
          cmake -S plugins/euphoria-amp-vst -B build-euphoria -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure Euphoria Amp CMake (Windows and Linux)
        if: runner.os != 'macOS'
        run: |
          cmake -S plugins/euphoria-amp-vst -B build-euphoria -DCMAKE_BUILD_TYPE=Release

      - name: Build Euphoria Amp Plugins
        run: |
          cmake --build build-euphoria --config Release --parallel

      - name: Package Euphoria Amp Desktop Binaries
        shell: bash
        run: |
          mkdir -p release_euphoria
          cp -r build-euphoria/EuphoriaAmp_artefacts/Release/* release_euphoria/
          cd release_euphoria && 7z a -tzip ../euphoria-amp-${{ matrix.platform }}.zip .

      - name: Publish Desktop Suites to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ultimate-hybrid
          name: "Tubular Amp & Euphoria Amp Suite v1.0.0 (VST3 / AU / Standalone / MODEP LV2)"
          files: |
            tubular-amp-${{ matrix.platform }}.zip
            euphoria-amp-${{ matrix.platform }}.zip

  build-modep-lv2-multiarch:
    name: Build MODEP Live Mixer LV2 (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cxx: aarch64-linux-gnu-g++
            flags: "-mcpu=cortex-a72 -O3"
          - arch: armhf
            cxx: arm-linux-gnueabihf-g++
            flags: "-O3"
          - arch: x86_64
            cxx: g++
            flags: "-O3"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf build-essential lv2-dev

      - name: Compile Tubular Amp LV2 Plugin
        run: |
          ${{ matrix.cxx }} ${{ matrix.flags }} -fPIC -shared -static-libstdc++ -static-libgcc -DCYBER_ENABLE_STUDIO_DELAY=0 -I plugins/include -I plugins/include/lv2 -I plugins/cyber-ultimate-hybrid.lv2/src plugins/cyber-ultimate-hybrid.lv2/src/cyber_ultimate_hybrid_lv2.cpp -o plugins/cyber-ultimate-hybrid.lv2/cyber_ultimate_hybrid.so
          tar -czvf tubular-amp-lv2-${{ matrix.arch }}.tar.gz -C plugins cyber-ultimate-hybrid.lv2

      - name: Compile Euphoria Amp LV2 Plugin
        run: |
          ${{ matrix.cxx }} ${{ matrix.flags }} -fPIC -shared -static-libstdc++ -static-libgcc -DCYBER_ENABLE_STUDIO_DELAY=0 -I plugins/include -I plugins/include/lv2 -I plugins/euphoria-amp.lv2/src plugins/euphoria-amp.lv2/src/euphoria_amp_lv2.cpp -o plugins/euphoria-amp.lv2/euphoria_amp.so
          tar -czvf euphoria-amp-lv2-${{ matrix.arch }}.tar.gz -C plugins euphoria-amp.lv2

      - name: Publish LV2 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-ultimate-hybrid
          name: "Tubular Amp & Euphoria Amp Suite v1.0.0 (VST3 / AU / Standalone / MODEP LV2)"
          files: |
            tubular-amp-lv2-${{ matrix.arch }}.tar.gz
            euphoria-amp-lv2-${{ matrix.arch }}.tar.gz
